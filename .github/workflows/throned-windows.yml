name: throned builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown by the application
        required: false
        default: dev
  pull_request:
  push:
    branches:
      - dev
      - "agent/**"
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: ubuntu-22.04
            artifact: windows-amd64
          - os: linux
            runner: ubuntu-22.04
            artifact: linux-amd64
    runs-on: ${{ matrix.runner }}
    env:
      DEST: ${{ github.workspace }}/deployment/${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/server/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Prepare Chromium toolchain
        if: matrix.os == 'linux'
        run: |
          set -xeuo pipefail
          git init "$HOME/cronet-go"
          git -C "$HOME/cronet-go" remote add origin https://github.com/parhelia512/cronet-go.git
          git -C "$HOME/cronet-go" fetch --depth=1 origin 9ed95366ae2f9b4b994cf54f8f9de0d8bc350057
          git -C "$HOME/cronet-go" checkout FETCH_HEAD
          git -C "$HOME/cronet-go" submodule update --init --recursive --depth=1
          cd "$HOME/cronet-go"
          go run ./cmd/build-naive --target=linux/amd64 download-toolchain
          go run ./cmd/build-naive --target=linux/amd64 env >> "$GITHUB_ENV"
      - name: Build ThroneCore
        run: GOOS=${{ matrix.os }} GOARCH=amd64 ./script/build_go.sh
      - name: Pack core artifact
        run: tar czf artifacts.tgz deployment
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: throned-core-${{ matrix.artifact }}
          path: artifacts.tgz
          compression-level: 0

  windows:
    needs: core
    runs-on: windows-latest
    env:
      INPUT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}
      DEST: ${{ github.workspace }}/deployment/windows-amd64
      GITHUB_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: throned-core-windows-amd64
          path: download-artifact
      - name: Download Qt and OpenSSL
        shell: bash
        run: |
          curl -fLso qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.11.1/Qt_6.11.1_x64.7z
          curl -fLso openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z
          7z x qt.7z
          7z x openssl.7z
      - name: Build portable application
        shell: bash
        run: |
          export CMAKE_PREFIX_PATH="$PWD/Qt/lib/cmake"
          export OPENSSL_ROOT_DIR="$PWD/openssl"
          mkdir build
          cd build
          curl -fLso srslist.h https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: throned-${{ github.sha }}-windows-amd64
          path: deployment/windows-amd64

  linux:
    needs: core
    runs-on: ubuntu-22.04
    env:
      INPUT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}
      DEST: ${{ github.workspace }}/deployment/linux-amd64
      GITHUB_WORKSPACE: ${{ github.workspace }}
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: throned-core-linux-amd64
          path: download-artifact
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.11.1"
          setup-python: true
          cache: true
          cache-key-prefix: throned-linux-amd64
      - name: Build portable application
        run: |
          mkdir build
          cd build
          curl -fLso srslist.h https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" ..
          ninja
          cd ..
          ./script/deploy_linux64.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: throned-${{ github.sha }}-linux-amd64
          path: deployment/linux-amd64

  release:
    if: github.ref_type == 'tag'
    needs:
      - windows
      - linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: throned-${{ github.sha }}-windows-amd64
          path: artifacts/windows
      - uses: actions/download-artifact@v8.0.1
        with:
          name: throned-${{ github.sha }}-linux-amd64
          path: artifacts/linux
      - name: Pack release files
        run: |
          mkdir -p package/windows/Throne package/linux/Throne
          cp -a artifacts/windows/. package/windows/Throne/
          cp -a artifacts/linux/. package/linux/Throne/
          rm -f package/windows/Throne/Throne.pdb
          rm -f package/linux/Throne/Throne.debug
          cd package/windows
          zip -9 -r "../../Throne-${GITHUB_REF_NAME}-windows64.zip" Throne
          cd ../linux
          zip -9 -r "../../Throne-${GITHUB_REF_NAME}-linux-amd64.zip" Throne
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Throne-${GITHUB_REF_NAME}-windows64.zip" \
            "Throne-${GITHUB_REF_NAME}-linux-amd64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
