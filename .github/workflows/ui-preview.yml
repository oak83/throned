name: throned ui preview

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/ui-redesign-*"
    paths:
      - "tools/ui-demo/**"
      - "include/ui/setting/ThronedPalette.hpp"
      - ".github/workflows/ui-preview.yml"
  pull_request:
    paths:
      - "tools/ui-demo/**"
      - "include/ui/setting/ThronedPalette.hpp"
      - ".github/workflows/ui-preview.yml"

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v6.1.0
        id: qt-cache
        with:
          path: qt.7z
          key: throned-ui-preview-qt-6.11.1-x64
      - name: Download Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: curl -fLso qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.11.1/Qt_6.11.1_x64.7z
      - name: Build preview
        shell: pwsh
        run: |
          7z x qt.7z
          cmake -S tools/ui-demo -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_PREFIX_PATH="$pwd/Qt/lib/cmake"
          cmake --build build-ui
      - name: Render review screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preview, package | Out-Null
          $env:PATH = "$pwd/Qt/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$pwd/Qt/plugins"
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen main --locale en --output preview/main-en.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen main --status selected --locale en --width 1000 --height 700 --output preview/main-selected-en.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen main --status url-test --locale en --width 1000 --height 700 --output preview/main-url-test-en.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen routes --locale en --output preview/routes-en.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen routes --locale en --width 1000 --height 700 --output preview/routes-1000x700.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen routes --locale en --width 1085 --height 761 --output preview/routes-1085x761.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen routes --mode advanced --locale en --output preview/routes-advanced-en.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen routes --locale ru --output preview/routes-ru.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen main --locale en --width 1000 --height 700 --output preview/main-1000x700.png" -Wait
          Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen settings --locale en --width 1000 --height 700 --output preview/settings-en.png" -Wait
          foreach ($theme in "midnight", "graphite", "ocean", "violet", "ember") {
            Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen main --locale en --theme $theme --width 1000 --height 700 --output preview/theme-$theme-main.png" -Wait
            Start-Process -FilePath "build-ui/Throned UI Preview.exe" -ArgumentList "--screen routes --locale en --theme $theme --width 1000 --height 700 --output preview/theme-$theme-routes.png" -Wait
          }
          Get-ChildItem preview/*.png | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
          Copy-Item "build-ui/Throned UI Preview.exe" package/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: throned-ui-preview-${{ github.sha }}
          path: |
            preview
            package
          compression-level: 6
